name: Generate Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output

      - name: Generate SVGs
        env:
          GITHUB_USERNAME: rajehdidntwakeup
        run: node .github/workflows/generate-stats.js

      - name: Verify SVGs
        run: |
          for f in stats.svg streak.svg top-langs.svg activity-graph.svg; do
            if [ ! -s "$f" ]; then
              echo "WARNING: $f is empty!"
            else
              echo "OK: $f ($(wc -c < $f) bytes)"
            fi
          done

      - name: Push to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update stats cards"
          git push origin output