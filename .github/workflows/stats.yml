name: Generate Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (for script)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Generate SVGs
        env:
          GITHUB_USERNAME: rajehdidntwakeup
        run: cd main && node .github/workflows/generate-stats.js

      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: output
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy SVGs to output
        run: cp main/stats.svg main/streak.svg main/top-langs.svg main/activity-graph.svg output/

      - name: Verify SVGs
        run: |
          for f in stats.svg streak.svg top-langs.svg activity-graph.svg; do
            if [ ! -s "output/$f" ]; then
              echo "WARNING: $f is empty!"
            else
              echo "OK: $f ($(wc -c < output/$f) bytes)"
            fi
          done

      - name: Push to output branch
        working-directory: output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update stats cards"
          git push origin output