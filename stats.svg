<svg xmlns="http://www.w3.org/2000/svg" width="495" height="258" viewBox="0 0 495 258">
  
  <defs>
    <linearGradient id="stats-bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="stats-accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="stats-topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#f778ba"/>
    </linearGradient>
    <filter id="stats-shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="stats-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="495" height="258" rx="16" fill="url(#stats-bgGrad)" stroke="#30363d" stroke-width="1" filter="url(#stats-shadow)"/>
  <rect x="0" y="0" width="495" height="4" rx="2" fill="url(#stats-topBar)"/>
  <text x="24" y="54" fill="#e6edf3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700">rajehdidntwakeup's GitHub Stats</text>
  <line x1="24" y1="66" x2="471" y2="66" stroke="#21262d" stroke-width="1"/>
  <text x="24" y="88" fill="#8b949e" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">⭐  Total Stars</text>
  <text x="471" y="88" fill="#e6edf3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">0</text>
  <line x1="24" y1="110" x2="471" y2="110" stroke="#21262d" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="24" y="128" fill="#8b949e" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">📦  Total Repos</text>
  <text x="471" y="128" fill="#e6edf3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">25</text>
  <line x1="24" y1="150" x2="471" y2="150" stroke="#21262d" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="24" y="168" fill="#8b949e" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">🍴  Total Forks</text>
  <text x="471" y="168" fill="#e6edf3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">0</text>
  <line x1="24" y1="190" x2="471" y2="190" stroke="#21262d" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="24" y="208" fill="#8b949e" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">🔥  Contributions</text>
  <text x="471" y="208" fill="#58a6ff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end" filter="url(#stats-glow)">682</text>
</svg>