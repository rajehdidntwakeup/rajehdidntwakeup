<svg xmlns="http://www.w3.org/2000/svg" width="495" height="186" viewBox="0 0 495 186">
  
  <defs>
    <linearGradient id="streak-bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="streak-accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="streak-topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#f778ba"/>
    </linearGradient>
    <filter id="streak-shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="streak-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="495" height="186" rx="16" fill="url(#streak-bgGrad)" stroke="#30363d" stroke-width="1" filter="url(#streak-shadow)"/>
  <rect x="0" y="0" width="495" height="4" rx="2" fill="url(#streak-topBar)"/>
  <text x="24" y="54" fill="#e6edf3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700">🔥 Streak Stats</text>
  <line x1="24" y1="66" x2="471" y2="66" stroke="#21262d" stroke-width="1"/>
  <text x="24" y="90" fill="#8b949e" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">🔥  Current Streak</text>
  <text x="471" y="90" fill="#58a6ff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end" filter="url(#streak-glow)">0 days</text>
  <rect x="24" y="100" width="8" height="6" rx="3" fill="url(#streak-accentGrad)" opacity="0.6"/>
  <text x="24" y="134" fill="#8b949e" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">⚡  Longest Streak</text>
  <text x="471" y="134" fill="#e6edf3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end">7 days</text>
  <rect x="24" y="144" width="14" height="6" rx="3" fill="url(#streak-accentGrad)" opacity="0.6"/>
</svg>